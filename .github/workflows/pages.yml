# Publishes the judge demo to GitHub Pages on every push to main.
# Site layout: pages/index.html at the root, ui/ copied to app/, so the replay
# always plays the recorded calls through the current UI. Static files only:
# no Server, no model, no API keys.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Judge demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["ui/**", "pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r pages/. _site/
          cp -r ui _site/app
          rm -f _site/app/AGENTS.md
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
