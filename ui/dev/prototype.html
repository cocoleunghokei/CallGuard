<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callguard panel prototype</title>
<!--
  Static visual mock for sign-off (not the app). Every panel state at 360 px,
  light row and dark row. No JS, no network. Copy and data are from the
  fixtures in ui/dev/fixtures/ (S1 government call).
-->
<style>
/* ---------- tokens (these move to ui/styles.css in T2) ---------- */
:root, .light {
  --bg: #f4f4f3;
  --surface: #ffffff;
  --surface-2: #f7f7f6;
  --text: #1c1c1e;
  --muted: #5d5d63;
  --border: #dedee1;
  --low: #1d7a3b;      --low-tint: #e8f5ec;
  --watch: #8a5800;    --watch-tint: #fdf3dd;
  --danger: #b3261e;   --danger-tint: #fcebea;  --danger-band: #b3261e;
  --idle: #6b6b70;     --idle-tint: #efeff0;
  --on-danger: #ffffff;
  --primary: #1f5fbf;  --on-primary: #ffffff;
  --focus: #0a64d6;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
.dark {
  --bg: #141416;
  --surface: #1e1e21;
  --surface-2: #26262a;
  --text: #f2f2f3;
  --muted: #a6a6ad;
  --border: #36363c;
  --low: #5cc77f;      --low-tint: #17291d;
  --watch: #f0b440;    --watch-tint: #33270f;
  --danger: #ff7a70;   --danger-tint: #3a1917;  --danger-band: #b8312a;
  --idle: #9c9ca3;     --idle-tint: #2a2a2e;
  --on-danger: #ffffff;
  --primary: #5b9bff;  --on-primary: #0b1a33;
  --focus: #7ab0ff;
  color-scheme: dark;
}

/* ---------- page that holds the mocks ---------- */
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: #d9d9dc; color: #1c1c1e; }
.page-head { padding: 24px 24px 8px; }
.page-head h1 { font-size: 20px; margin: 0 0 4px; }
.page-head p { margin: 0; font-size: 13px; color: #4a4a50; max-width: 900px; }
.row { padding: 16px 24px 32px; }
.row > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #4a4a50; margin: 0 0 12px; }
.row.dark-row { background: #0d0d0f; }
.row.dark-row > h2 { color: #b4b4ba; }
.strip { display: flex; gap: 24px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.cell { flex: 0 0 auto; }
.cell > .label { font-size: 12px; font-weight: 600; color: #4a4a50; margin-bottom: 6px; }
.dark-row .cell > .label { color: #b4b4ba; }

/* ---------- the panel (360 px window) ---------- */
.win {
  width: 360px; min-height: 640px; position: relative; overflow: hidden;
  background: var(--bg); color: var(--text); font: 13px/1.4 var(--font);
  border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  display: flex; flex-direction: column;
}
.titlebar { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.titlebar i { width: 11px; height: 11px; border-radius: 50%; background: var(--border); display: block; }
.titlebar span { margin-left: auto; margin-right: auto; font-size: 12px; color: var(--muted); padding-right: 40px; }

/* A header */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: var(--s3) var(--s4); background: var(--surface); border-bottom: 1px solid var(--border); }
.badge { display: flex; align-items: center; gap: var(--s2); font-weight: 600; }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.badge small { font-weight: 400; color: var(--muted); font-size: 12px; }
.badge.off .dot { background: var(--idle); }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.net .dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--low); }
.net.offline .dot { border-color: var(--idle); background: transparent; }
.net.offline { color: var(--text); font-weight: 600; }

.consent { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s2) var(--s4); font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
.consent a { color: var(--primary); text-decoration: underline; }
.consent .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 14px; line-height: 1; padding: 0 2px; }

/* B banners */
.banner { margin: var(--s3) var(--s4) 0; padding: var(--s2) var(--s3); border-radius: var(--r-sm); font-size: 12px; display: flex; gap: var(--s2); align-items: center; }
.banner.watch { background: var(--watch-tint); color: var(--text); border: 1px solid var(--watch); }
.banner.watch b { color: var(--watch); }
.banner.idle { background: var(--idle-tint); color: var(--text); border: 1px solid var(--border); }

.body { padding: var(--s3) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); flex: 1; }

/* C meter */
.meter { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3); display: grid; grid-template-columns: 36px 1fr; column-gap: var(--s3); align-items: center; }
.meter .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.meter .word { font-size: 15px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.meter .how { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: var(--s2); margin-top: 2px; }
.bar { display: inline-flex; gap: 2px; }
.bar i { width: 9px; height: 8px; border-radius: 2px; background: var(--border); display: block; }
.lvl-idle .ico { background: var(--idle-tint); color: var(--idle); }
.lvl-idle .word { color: var(--idle); }
.lvl-low .ico { background: var(--low-tint); color: var(--low); }
.lvl-low .word { color: var(--low); }
.lvl-low .bar i.on { background: var(--low); }
.lvl-watch { border-color: var(--watch); background: var(--watch-tint); }
.lvl-watch .ico { background: var(--surface); color: var(--watch); }
.lvl-watch .word { color: var(--watch); }
.lvl-watch .bar i.on { background: var(--watch); }
.lvl-watch .how { color: var(--text); }

/* D watch note */
.note { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.note .reason { margin: 0; }
.note .reason.grey { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; }
.chip .caret { color: var(--muted); font-size: 10px; }
.chip[aria-expanded="true"] { border-color: var(--watch); background: var(--watch-tint); }
.quote { margin: 0; padding: var(--s2) var(--s3); border-left: 3px solid var(--watch); background: var(--surface-2); font-style: italic; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.quote small { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.rule { font-size: 12px; display: flex; gap: 6px; }
.rule b { white-space: nowrap; }
.verify { font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; padding-top: var(--s2); border-top: 1px solid var(--border); }
.verify .num { white-space: nowrap; font-weight: 700; font-size: 13px; }
.verify .src { color: var(--muted); }
.verify.off { color: var(--text); }
.next { font-size: 13px; font-weight: 600; }
.next::before { content: "→ "; color: var(--muted); }

.side-actions { display: flex; gap: var(--s2); }
.btn { font: inherit; font-size: 13px; border-radius: var(--r-sm); padding: 7px 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.btn.quiet { flex: 1; }

/* E transcript tail */
.sect-h { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 6px; display: flex; justify-content: space-between; }
.tail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s3); }
.tail p { margin: 0 0 4px; display: grid; grid-template-columns: 48px 1fr; gap: var(--s2); }
.tail p:last-child { margin-bottom: 0; }
.tail .who { font-size: 12px; color: var(--muted); font-weight: 600; }
.tail .you .who { color: var(--primary); }
.tail .empty { display: block; color: var(--muted); }

/* F egress */
.egress { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.egress .sect-h { padding: var(--s2) var(--s3); margin: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--text); }
.egress .sect-h.flash { background: var(--watch-tint); }
.egress .count { color: var(--muted); font-weight: 400; }
.eg-empty { padding: var(--s4) var(--s3); display: grid; grid-template-columns: 28px 1fr; gap: var(--s2); align-items: center; }
.eg-empty .shield { width: 28px; height: 28px; border-radius: 50%; background: var(--low-tint); color: var(--low); display: grid; place-items: center; font-weight: 700; }
.eg-empty b { display: block; }
.eg-empty span { font-size: 12px; color: var(--muted); }
.eg-row { padding: var(--s2) var(--s3); font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: var(--s2); align-items: baseline; border-bottom: 1px solid var(--border); }
.eg-row:last-child { border-bottom: 0; }
.eg-row time { color: var(--muted); font-variant-numeric: tabular-nums; }
.eg-row .sent { font-weight: 600; }
.eg-row .dest { color: var(--muted); display: block; font-weight: 400; }
.st { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.st.ok { color: var(--low); }
.st.offline { color: var(--idle); }
.eg-foot { padding: var(--s2) var(--s3); font-size: 12px; color: var(--muted); background: var(--surface-2); border-top: 1px solid var(--border); }

/* ---------- danger overlay (covers the whole window) ---------- */
.ovl { position: absolute; inset: 28px 0 0 0; background: var(--surface); display: flex; flex-direction: column; }
.ovl-head { background: var(--danger-band); color: var(--on-danger); padding: var(--s4); }
.ovl-head h3 { margin: 0; font-size: 22px; line-height: 1.15; display: flex; gap: var(--s2); align-items: flex-start; }
.ovl-head .how { margin-top: var(--s2); font-size: 12px; display: flex; gap: var(--s2); align-items: center; }
.ovl-head .bar i { background: rgba(255,255,255,.35); }
.ovl-head .bar i.on { background: #fff; }
.ovl-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); overflow: auto; flex: 1; }
.claims { font-size: 13px; }
.claims b { font-size: 15px; display: block; }
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
.tlist li { padding-left: var(--s3); border-left: 3px solid var(--danger); }
.tlist b { display: block; }
.tlist q { color: var(--muted); font-style: italic; }
.rules-box { background: var(--danger-tint); border-radius: var(--r-sm); padding: var(--s2) var(--s3); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.realnum { border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--s2) var(--s3); display: flex; justify-content: space-between; align-items: center; }
.realnum small { color: var(--muted); font-size: 12px; display: block; }
.realnum .n { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gate { background: var(--surface-2); border: 1px dashed var(--danger); border-radius: var(--r-sm); padding: var(--s2) var(--s3); font-size: 12px; display: flex; gap: var(--s2); }
.gate time { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.exits { border-top: 1px solid var(--border); padding: var(--s3) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s2); background: var(--surface); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 700; font-size: 15px; padding: 11px 14px; width: 100%; }
.btn.secondary { width: 100%; padding: 9px 14px; }
.focus { outline: 2px solid var(--focus); outline-offset: 2px; }
.safe { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); align-items: center; margin-top: var(--s1); }
.safe label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.safe input { font: inherit; padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); text-transform: uppercase; letter-spacing: .1em; width: 100%; }
.hold { position: relative; overflow: hidden; font-size: 12px; white-space: nowrap; }
.hold .fill { position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--low-tint); }
.hold span { position: relative; }

/* exit result card */
.callback { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--r-lg); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.callback h4 { margin: 0; font-size: 15px; }
.callback .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.callback small { color: var(--muted); font-size: 12px; }
.toast { background: var(--text); color: var(--bg); border-radius: var(--r-sm); padding: var(--s2) var(--s3); font-size: 12px; }
</style>
</head>
<body>

<div class="page-head">
  <h1>Callguard: panel prototype</h1>
  <p>Static mock for sign-off. Each frame is the 360 px window beside Zoom. Data from the S1 government-call fixture. Top row light, bottom row dark (the real app follows the Mac setting).</p>
</div>

<!-- The same strip is rendered twice; the second copy has class "dark". -->
<template id="strip">
<div class="strip">

  <!-- 1 IDLE -->
  <div class="cell"><div class="label">1 · Idle / first open (F0)</div>
  <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>Callguard</span></div>
    <div class="hdr">
      <div class="badge"><span class="dot"></span><span>Listening locally<br><small>nothing stored</small></span></div>
      <div class="net"><span class="dot"></span>Online</div>
    </div>
    <div class="consent">
      <span>Callguard checks this call on your laptop. Nothing is recorded or sent. <a href="#">Why?</a></span>
      <button class="x" aria-label="Dismiss">×</button>
    </div>
    <div class="body">
      <div class="meter lvl-idle"><div class="ico">○</div><div><div class="word">Not on a call</div><div class="how">Callguard starts when a call does</div></div></div>
      <div>
        <div class="sect-h">On this call</div>
        <div class="tail"><span class="empty">The last few lines of the call show here, then are deleted when it ends.</span></div>
      </div>
      <div class="egress">
        <div class="sect-h">What left this device <span class="count">0</span></div>
        <div class="eg-empty"><div class="shield">✓</div><div><b>Nothing has left this device</b><span>Your call audio and words stay on this laptop.</span></div></div>
      </div>
    </div>
  </div></div>

  <!-- 2 LOW -->
  <div class="cell"><div class="label">2 · Low: normal call stays quiet (F1)</div>
  <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>Callguard</span></div>
    <div class="hdr">
      <div class="badge"><span class="dot"></span><span>Listening locally<br><small>nothing stored</small></span></div>
      <div class="net"><span class="dot"></span>Online</div>
    </div>
    <div class="body">
      <div class="meter lvl-low"><div class="ico">✓</div><div><div class="word">Low</div><div class="how">No clear signs <span class="bar"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></div></div>
      <div>
        <div class="sect-h">On this call</div>
        <div class="tail">
          <p><span class="who">Caller</span><span>Can we push the 3pm? I need the draft by five.</span></p>
          <p class="you"><span class="who">You</span><span>No problem, I'll move it to 4 and send the draft before five.</span></p>
        </div>
      </div>
      <div class="egress">
        <div class="sect-h">What left this device <span class="count">0</span></div>
        <div class="eg-empty"><div class="shield">✓</div><div><b>Nothing has left this device</b><span>Your call audio and words stay on this laptop.</span></div></div>
      </div>
    </div>
  </div></div>

  <!-- 3 WATCH -->
  <div class="cell"><div class="label">3 · Watch: verify first (F2, F6, F10)</div>
  <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>Callguard</span></div>
    <div class="hdr">
      <div class="badge"><span class="dot"></span><span>Listening locally<br><small>nothing stored</small></span></div>
      <div class="net"><span class="dot"></span>Online</div>
    </div>
    <div class="body">
      <div class="meter lvl-watch"><div class="ico">◐</div><div><div class="word">Watch</div><div class="how">Some signs <span class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span></div></div></div>
      <div class="note">
        <p class="reason">Caller claims to be a government official and says you are under investigation.</p>
        <div class="chips">
          <button class="chip">Claims to be an official or someone senior <span class="caret">▸</span></button>
          <button class="chip" aria-expanded="true">Threatens you or the firm <span class="caret">▾</span></button>
        </div>
        <blockquote class="quote"><small>Caller said</small>“You're under investigation and could face extradition.”</blockquote>
        <div class="verify"><span>Department of Justice public number:</span><span class="num">(202) 514-2000</span><span class="src">· justice.gov</span></div>
        <div class="next">Verify first: don't share anything until you've called the Department of Justice on its public number.</div>
        <div class="side-actions"><button class="btn quiet">Check with a colleague</button><button class="btn quiet">Mark as safe</button></div>
      </div>
      <div>
        <div class="sect-h">On this call</div>
        <div class="tail">
          <p><span class="who">Caller</span><span>Hi, this is Officer Chen from the Department of Justice.</span></p>
          <p class="you"><span class="who">You</span><span>Okay. What is this about?</span></p>
          <p><span class="who">Caller</span><span>…money-laundering case. You're under investigation and could face extradition.</span></p>
        </div>
      </div>
      <div class="egress">
        <div class="sect-h flash">What left this device <span class="count">1</span></div>
        <div class="eg-row"><time>19:02:11</time><span><span class="sent">“Department of Justice”</span><span class="dest">to api.tavily.com, to look up its public number</span></span><span class="st ok">ok</span></div>
        <div class="eg-foot">Only the name above was sent. Your call audio and words never leave this laptop.</div>
      </div>
    </div>
  </div></div>

  <!-- 4 DANGER + GATE -->
  <div class="cell"><div class="label">4 · Danger overlay + typing paused (F3, F4)</div>
  <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>Callguard</span></div>
    <div class="ovl" role="alertdialog" aria-label="Stop and verify this call">
      <div class="ovl-head">
        <h3><span>⚠</span><span>Stop and verify this call</span></h3>
        <div class="how"><b>Strong signs</b> <span class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></div>
      </div>
      <div class="ovl-body">
        <div class="claims">The caller claims to be:<b>Department of Justice</b></div>
        <ul class="tlist">
          <li><b>Threatens you or the firm</b><q>You're under investigation and could face extradition.</q></li>
          <li><b>Asks you to keep it secret</b><q>Do not tell your colleagues or your firm</q></li>
          <li><b>Asks for client or personal data</b><q>I need to verify your bank account number and routing number</q></li>
        </ul>
        <div class="rules-box">
          <div><b>Firm rule:</b> Government agencies do not ask for payment or bank details by phone.</div>
          <div><b>Firm rule:</b> No one at this firm will ask you to keep a call secret from your colleagues.</div>
        </div>
        <div class="realnum"><div><small>Real public number · justice.gov</small><span class="n">(202) 514-2000</span></div></div>
        <div class="gate"><span>🔒</span><span>Typing is paused while this call asks for bank details</span><time>1:54</time></div>
        <div class="next">Hang up. Don't share bank details. Call the Department of Justice on its public number.</div>
      </div>
      <div class="exits">
        <button class="btn primary focus">Hang up and call back</button>
        <button class="btn secondary">Check with a colleague</button>
        <div class="safe">
          <label for="safe1">Already verified? Type SAFE, then hold the button for 3 s</label>
          <input id="safe1" value="saf" aria-label="Type SAFE">
          <button class="btn hold"><span class="fill"></span><span>Hold: it's safe</span></button>
        </div>
      </div>
    </div>
  </div></div>

  <!-- 5 EXIT: HANG UP -->
  <div class="cell"><div class="label">5 · After “Hang up and call back” (F5)</div>
  <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>Callguard</span></div>
    <div class="ovl">
      <div class="ovl-head">
        <h3><span>⚠</span><span>Stop and verify this call</span></h3>
        <div class="how"><b>Strong signs</b> <span class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></div>
      </div>
